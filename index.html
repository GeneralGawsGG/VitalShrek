<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitalShark Воздух</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .video-container {
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #e0e0e0;
        }

        /* Стиль для адаптивного видеоплеера */
        video {
            width: 100%;
            max-height: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #ff4757;
            font-size: 28px;
        }

        .modal-content p {
            color: #a0a0a0;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .modal-btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .modal-btn:hover {
            background-color: #ff6b81;
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <div id="welcome-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Внимание!</h2>
            <p>Фанатам VitalSharka не смотреть!</p>
            <button id="close-btn" class="modal-btn">Смотреть</button>
        </div>
    </div>

    <div class="video-container">
        <h1>Признание VitalSharka в то что он воздух!!!!!!!</h1>
        <video id="my-video" controls>
            <source src="media.mp4" type="video/mp4">
            Ваш браузер не поддерживает просмотр этого видео.
        </video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const modal = document.getElementById("welcome-modal");
            const closeBtn = document.getElementById("close-btn");
            const video = document.getElementById("my-video");

            closeBtn.addEventListener("click", function() {
                modal.style.opacity = "0";
                setTimeout(() => {
                    modal.style.display = "none";
                    // Бонус: видео начнет играть автоматически после закрытия окна
                    video.play().catch(error => {
                        console.log("Автозапуск заблокирован браузером, нужен клик по плееру");
                    });
                }, 300);
            });
        });
    </script>
</body>
</html>
